<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>个人厨房工作台</title><style>:root{--bg:#f6f7f4;--card:#fff;--text:#1c231f;--muted:#7a837d;--line:#e6e9e4;--accent:#2f6f4e;--soft:#eaf3ed}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.shell.collapsed{grid-template-columns:76px 1fr}.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow:hidden}.sideHead{display:flex;gap:10px;align-items:center;margin-bottom:20px}.logo{width:42px;height:42px;border-radius:13px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}.brand{font-weight:800;white-space:nowrap}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;border-radius:11px;padding:11px 12px;text-align:left;display:flex;gap:10px;align-items:center}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}.collapsed .brand,.collapsed .label{display:none}.collapsed .nav button{justify-content:center}.main{padding:22px 28px;max-width:1320px;width:100%;margin:auto}.top{display:flex;gap:10px;align-items:center;margin-bottom:22px}.menu{border:1px solid var(--line);background:#fff;border-radius:12px;min-width:44px;height:44px}.search{width:min(560px,100%);height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 14px;outline:0}.search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(47,111,78,.08)}.hero{background:linear-gradient(135deg,#f2efe7,#e9f3eb);border-radius:22px;padding:24px;margin-bottom:24px}.hero h1{margin:0 0 6px;font-size:32px}.hero p{margin:0;color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);background:#fff;border-radius:17px;overflow:hidden}.card button{all:unset;display:block;width:100%;cursor:pointer}.pic{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#ddd7ca,#c9d8cb)}.body{padding:15px}.title{font-weight:800;font-size:18px;margin-bottom:9px}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{font-size:12px;background:#f3f5f2;border:1px solid var(--line);border-radius:999px;padding:4px 7px}.meta{font-size:13px;color:var(--muted);margin-top:10px}.detail{max-width:950px;margin:auto}.back{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0 0 14px}.cover{aspect-ratio:16/6;border-radius:22px 22px 0 0;display:flex;align-items:center;justify-content:center;font-size:86px;background:linear-gradient(135deg,#d7c8b7,#a8c2aa)}.detailBox,.ings{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}.detailText{padding:22px}.detailText h1{margin:0 0 8px;font-size:32px}.detailText p{color:var(--muted)}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#f3f5f2;border-radius:999px;padding:7px 11px;font-size:13px}.ings{margin-top:20px;padding:20px}.ingGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.ing{border:1px solid var(--line);background:#fafbf9;border-radius:14px;padding:13px;text-align:center}.ing.active{background:var(--soft);border-color:var(--accent)}.ingIcon{font-size:28px}.related{margin-top:22px}.drawerMask{display:none}@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.ingGrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.shell,.shell.collapsed{display:block}.side{position:fixed;left:0;top:0;bottom:0;width:280px;height:100vh;z-index:30;transform:translateX(-100%);transition:.22s}.side.open{transform:translateX(0)}.collapsed .brand,.collapsed .label{display:block}.collapsed .nav button{justify-content:flex-start}.drawerMask.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:20}.main{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:27px}.cover{aspect-ratio:4/3;font-size:68px}.ingGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div id="app"></div><script>const cats=['全部','主食','海鲜','炒菜','汤类','凉菜','甜品','饮品'],icons={全部:'📚',主食:'🍚',海鲜:'🐟',炒菜:'🍳',汤类:'🥣',凉菜:'🥗',甜品:'🍰',饮品:'🥤'};const R=[{id:1,n:'番茄炒蛋',c:'炒菜',e:'🍅',t:'10分钟',d:'简单',s:'2人',x:'酸甜开胃的家常菜。',i:['番茄','鸡蛋','葱','盐']},{id:2,n:'青椒炒蛋',c:'炒菜',e:'🫑',t:'15分钟',d:'简单',s:'2-3人',x:'青椒清香配上嫩滑鸡蛋。',i:['青椒','鸡蛋','蒜','盐','食用油']},{id:3,n:'宫保鸡丁',c:'炒菜',e:'🍗',t:'20分钟',d:'中等',s:'2-3人',x:'咸鲜微辣，经典下饭菜。',i:['鸡胸肉','花生','干辣椒','葱']},{id:4,n:'清蒸鲈鱼',c:'海鲜',e:'🐟',t:'15分钟',d:'简单',s:'2人',x:'鲜嫩清爽，突出鱼本味。',i:['鲈鱼','姜','葱','生抽']},{id:5,n:'蒜蓉大虾',c:'海鲜',e:'🦐',t:'20分钟',d:'简单',s:'2-3人',x:'鲜香浓郁，做法简单。',i:['大虾','大蒜','生抽','料酒','盐','黑胡椒','葱','食用油']},{id:6,n:'海鲜炒饭',c:'主食',e:'🍚',t:'15分钟',d:'简单',s:'2人',x:'一锅完成的快手主食。',i:['米饭','虾仁','鸡蛋','葱']},{id:7,n:'牛肉炒面',c:'主食',e:'🍜',t:'20分钟',d:'简单',s:'2人',x:'牛肉香嫩，面条入味。',i:['牛肉','面条','洋葱','生抽']},{id:8,n:'冬瓜排骨汤',c:'汤类',e:'🥣',t:'40分钟',d:'简单',s:'3人',x:'清淡鲜甜，适合日常。',i:['冬瓜','排骨','姜','盐']},{id:9,n:'凉拌黄瓜',c:'凉菜',e:'🥒',t:'10分钟',d:'简单',s:'2人',x:'爽脆开胃。',i:['黄瓜','大蒜','香醋','盐']},{id:10,n:'青椒炒牛肉',c:'炒菜',e:'🥩',t:'20分钟',d:'中等',s:'2人',x:'青椒脆嫩，牛肉滑香。',i:['青椒','牛肉','姜','生抽']},{id:11,n:'虎皮青椒',c:'炒菜',e:'🌶️',t:'15分钟',d:'简单',s:'2人',x:'香辣过瘾。',i:['青椒','大蒜','生抽','醋']},{id:12,n:'青椒肉丝',c:'炒菜',e:'🥢',t:'15分钟',d:'简单',s:'2人',x:'家常快手，百吃不腻。',i:['青椒','猪肉','葱','生抽']},{id:13,n:'青椒土豆丝',c:'炒菜',e:'🥔',t:'15分钟',d:'简单',s:'2人',x:'清爽脆嫩。',i:['青椒','土豆','醋','盐']}];let S={cat:'全部',q:'',page:'list',r:null,ing:null,col:false,open:false};function filtered(){let q=S.q.trim();return R.filter(r=>(S.cat==='全部'||r.c===S.cat)&&(!q||r.n.includes(q)||r.i.some(x=>x.includes(q))))}function card(r){return `<article class="card"><button onclick="openRecipe(${r.id})"><div class="pic">${r.e}</div><div class="body"><div class="title">${r.n}</div><div class="tags">${r.i.slice(0,4).map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="meta">⏱ ${r.t} · ${r.d}</div></div></button></article>`}function side(){return `<aside class="side ${S.open?'open':''}"><div class="sideHead"><div class="logo">🍳</div><div class="brand">个人厨房工作台<small>记录美味，享受生活</small></div></div><nav class="nav">${cats.map(c=>`<button class="${S.cat===c?'active':''}" onclick="setCat('${c}')"><span>${icons[c]}</span><span class="label">${c}</span></button>`).join('')}</nav></aside>`}function shell(content){return `<div class="shell ${S.col?'collapsed':''}">${side()}<main class="main"><div class="top"><button class="menu" onclick="toggleSide()">☰</button><input id="search" class="search" placeholder="搜索菜谱、食材…" value="${S.q.replace(/"/g,'&quot;')}"></div>${content}</main></div><div class="drawerMask ${S.open?'show':''}" onclick="closeSide()"></div>`}function listHTML(){let a=filtered();return `<section class="hero"><h1>我的厨房</h1><p>按分类浏览，也可以从一个食材出发发现更多菜谱。</p></section><div class="head"><h2>菜品列表</h2><span id="count">${a.length} 道</span></div><section id="recipeGrid" class="grid">${a.map(card).join('')}</section>`}function renderList(){document.getElementById('app').innerHTML=shell(listHTML());bindSearch()}function updateGrid(){let a=filtered(),g=document.getElementById('recipeGrid'),c=document.getElementById('count');if(g)g.innerHTML=a.length?a.map(card).join(''):'<div>没有找到相关菜谱。</div>';if(c)c.textContent=a.length+' 道'}function bindSearch(){let el=document.getElementById('search');if(!el)return;let composing=false;el.addEventListener('compositionstart',()=>composing=true);el.addEventListener('compositionend',()=>{composing=false;S.q=el.value;updateGrid()});el.addEventListener('input',()=>{if(!composing){S.q=el.value;updateGrid()}})}function detail(){let r=S.r,rel=S.ing?R.filter(x=>x.id!==r.id&&x.i.includes(S.ing)):[];return `<section class="detail"><button class="back" onclick="back()">← 返回菜谱列表</button><div class="detailBox"><div class="cover">${r.e}</div><div class="detailText"><h1>${r.n}</h1><p>${r.x}</p><div class="pills"><span class="pill">⏱ ${r.t}</span><span class="pill">${r.d}</span><span class="pill">👥 ${r.s}</span></div></div></div><section class="ings"><h3>用料</h3><div class="ingGrid">${r.i.map(i=>`<button class="ing ${S.ing===i?'active':''}" onclick="pick('${i}')"><div class="ingIcon">${ingIcon(i)}</div><div>${i}</div></button>`).join('')}</div></section>${S.ing?`<section class="related"><h3>相关菜谱 · ${S.ing}</h3><p>包含「${S.ing}」的其他菜谱</p><div class="grid">${rel.length?rel.map(card).join(''):'暂时没有更多相关菜谱。'}</div></section>`:''}</section>`}function renderDetail(){document.getElementById('app').innerHTML=shell(detail());bindSearch()}function ingIcon(i){return({青椒:'🫑',鸡蛋:'🥚',蒜:'🧄',大蒜:'🧄',盐:'🧂',番茄:'🍅',牛肉:'🥩',猪肉:'🥩',葱:'🌿',姜:'🫚',土豆:'🥔',大虾:'🦐',鲈鱼:'🐟',米饭:'🍚',面条:'🍜',黄瓜:'🥒'}[i]||'🥣')}window.setCat=c=>{S.cat=c;S.page='list';S.r=null;S.ing=null;S.open=false;renderList()};window.openRecipe=id=>{S.r=R.find(r=>r.id===id);S.page='detail';S.ing=null;S.open=false;renderDetail();scrollTo(0,0)};window.pick=i=>{S.ing=i;renderDetail();setTimeout(()=>document.querySelector('.related')?.scrollIntoView({behavior:'smooth'}),0)};window.back=()=>{S.page='list';S.r=null;S.ing=null;renderList()};window.toggleSide=()=>{if(innerWidth<=760){S.open=!S.open}else S.col=!S.col;S.page==='list'?renderList():renderDetail()};window.closeSide=()=>{S.open=false;S.page==='list'?renderList():renderDetail()};renderList();</script></body></html>
