<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e7">
  <title>開開厨房</title>
  <style>
    :root{--bg:#f5f1e7;--panel:#fbf9f3;--ink:#2e2923;--muted:#777064;--wine:#6d3037;--line:#d9d1c3}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{border:0;background:none;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--wine);outline-offset:3px}img{display:block;width:100%;height:100%;object-fit:cover}

    .toolbar{min-height:54px;margin-bottom:24px;display:flex;align-items:flex-start;justify-content:space-between;gap:25px}.toolbar-title{display:flex;align-items:baseline;gap:14px}.toolbar h1{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:30px;font-weight:500;letter-spacing:3px}.toolbar p{margin:0;color:var(--muted);font-size:13px}.toolbar-actions{display:flex;gap:9px}.search{width:280px;height:43px;padding:0 13px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:9px;color:var(--muted)}.search input{width:100%;height:100%;border:0;outline:0;background:none;font-size:14px}.search button{display:flex;padding:3px;font-size:18px}.add-dish{height:43px;padding:0 16px;background:var(--wine);color:#fff;font-size:13px;white-space:nowrap}
    .recipe-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px 18px}.recipe>button{width:100%;padding:0;text-align:left}.dish-image{width:100%;aspect-ratio:1.18;overflow:hidden;background:#ded7ca}.dish-image img{transition:transform .35s}.recipe>button:hover img{transform:scale(1.025)}.screenshot-image{background-repeat:no-repeat;background-size:545.4% auto}.image-placeholder{display:grid;place-items:center;color:#8e867a;font-size:13px}.recipe-info{padding-top:13px}.recipe-info>div{display:flex;justify-content:space-between;align-items:center;gap:10px}.recipe-info h2{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:19px;font-weight:600}.recipe-info span{flex:none;padding:3px 7px;border:1px solid var(--line);color:var(--muted);font-size:11px}.recipe-info p{margin:9px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .detail-main{max-width:1280px;min-height:calc(100vh - 150px);margin:auto;padding:0 4%}.back{display:flex;align-items:center;gap:9px;margin:28px 0;color:var(--wine);font-size:14px}.detail{display:grid;grid-template-columns:1.15fr 1fr;align-items:center;gap:55px;padding-bottom:54px}.detail-visual>.dish-image{aspect-ratio:1.25}.image-actions{display:flex;gap:9px;margin-top:11px}.image-actions label,.image-actions button{display:flex;align-items:center;gap:7px;padding:10px 13px;border:1px solid var(--line);background:var(--panel);font-size:12px;cursor:pointer}.image-actions label{color:#fff;background:var(--wine);border-color:var(--wine)}.image-actions input{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.image-notice{display:block;margin-top:9px;color:var(--muted);font-size:11px}.detail-copy{max-width:480px}.category-label{color:var(--wine);font-size:13px}.detail h1{margin:14px 0 0;font-family:"Songti SC","STSong","SimSun",serif;font-size:40px;font-weight:600;letter-spacing:2px}.ingredients{margin-top:30px;padding-top:24px;border-top:1px solid var(--line)}.ingredients h2{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:20px;font-weight:500}.ingredients>p{margin:8px 0 16px;color:var(--muted);font-size:12px}.ingredient-list{display:flex;flex-wrap:wrap;gap:9px}.ingredient-list span,.ingredient-list button{padding:9px 13px;border:1px solid var(--line);font-size:13px}.ingredient-list button{background:var(--panel)}.ingredient-list button b{margin-left:16px;color:var(--wine);font-weight:400}.ingredient-list button.active{color:#fff;background:var(--wine);border-color:var(--wine)}.ingredient-list button.active b{color:#fff}.ingredient-list .plain{color:#9a9287;background:#ece7dc;border-color:transparent}.related{padding:30px 0 65px;border-top:1px solid var(--line)}.related-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.related-heading>div{display:flex;align-items:baseline;gap:14px}.related-heading h2{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:23px;font-weight:500}.related-heading span{color:var(--muted);font-size:12px}.related-heading>button{color:var(--wine);font-size:12px}.empty{padding:70px 20px;text-align:center;color:var(--muted)}.empty button{display:block;margin:12px auto;color:var(--wine)}
    .detail-controls{display:flex;align-items:center;gap:18px;margin-top:30px}.edit-dish{padding:10px 14px;border:1px solid var(--wine);background:var(--wine);color:#fff;font-size:12px}.delete-dish{padding:8px 0;color:#9b514f;font-size:12px}.modal-mask{position:fixed;inset:0;z-index:50;padding:24px;display:flex;align-items:center;justify-content:center;background:rgba(31,26,22,.48);backdrop-filter:blur(3px)}.modal{width:min(560px,100%);max-height:calc(100vh - 48px);overflow:auto;padding:25px;background:var(--panel);box-shadow:0 24px 70px rgba(31,26,22,.22)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.modal-head h2{margin:0;font-family:"Songti SC","STSong","SimSun",serif;font-size:25px;font-weight:600}.modal-head button{font-size:24px;color:var(--muted)}.add-form{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}.add-form label{display:grid;gap:8px;color:var(--muted);font-size:12px}.add-form input,.add-form select,.add-form textarea{width:100%;border:1px solid var(--line);border-radius:0;background:#fff;color:var(--ink);font:inherit;font-size:14px;padding:11px 12px}.add-form textarea{min-height:82px;resize:vertical}.add-form .full{grid-column:1/-1}.form-note{margin:0;color:#9b514f;font-size:12px}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;padding-top:4px}.form-actions button{min-width:88px;padding:10px 14px;border:1px solid var(--line);font-size:13px}.form-actions .primary{border-color:var(--wine);background:var(--wine);color:#fff}footer{margin:0 4%;padding:20px 0 28px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:#938b7f;font-size:11px}
    @media(max-width:1250px){.recipe-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:850px){header{height:76px;margin:0 18px}header>button{font-size:26px;letter-spacing:3px}.workspace{display:block;padding:18px 16px 44px}aside{margin-bottom:22px;padding:0 0 12px;border:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}aside::-webkit-scrollbar{display:none}nav{position:static;display:flex;flex-direction:row;min-width:max-content;gap:6px}nav button{width:auto;min-width:98px;grid-template-columns:22px auto auto;padding:10px 12px}aside>p{display:none}.toolbar{align-items:center}.recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.detail-main{padding:0 16px}.detail{grid-template-columns:1fr;gap:28px}.detail-visual>.dish-image{max-height:520px}.image-actions label,.image-actions button{min-height:44px}.related .recipe-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){
      header{position:sticky;top:0;z-index:20;height:72px;margin:0;padding:0 15px;background:rgba(245,241,231,.96);backdrop-filter:blur(12px)}header>button{font-size:24px}
      .workspace{padding:0 14px 36px}aside{position:sticky;top:72px;z-index:15;margin:0 -14px 17px;padding:9px 14px;background:rgba(245,241,231,.97);box-shadow:0 7px 14px rgba(46,41,35,.04)}nav{gap:5px}nav button{min-width:86px;padding:8px 10px;font-size:13px}.nav-icon{font-size:14px}
      .toolbar{display:block;min-height:auto;margin-bottom:13px}.toolbar-title{padding:2px 1px 10px}.toolbar h1{font-size:25px}.toolbar-actions{display:grid;grid-template-columns:minmax(0,1fr) auto}.search{width:100%;height:43px;margin:0}.add-dish{height:43px;padding:0 14px}
      .recipe-grid,.related .recipe-grid{display:block}.recipe{border-bottom:1px solid var(--line)}.recipe>button{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;padding:12px 0}.recipe .dish-image{width:92px;height:92px;aspect-ratio:auto;border-radius:7px}.recipe-info{min-width:0;padding:4px 0}.recipe-info>div{display:block}.recipe-info h2{font-size:17px;line-height:1.35}.recipe-info span{display:inline-block;margin-top:7px;padding:2px 6px;font-size:10px}.recipe-info p{margin-top:8px;padding-top:0;border-top:0;font-size:11px;line-height:1.6;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .detail-main{padding:0 14px}.back{margin:18px 0}.detail{gap:19px;padding-bottom:35px}.detail-visual>.dish-image{max-height:260px;aspect-ratio:1.65;border-radius:8px}.detail h1{margin-top:9px;font-size:30px}.image-actions{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}.image-actions label,.image-actions button{min-height:43px;justify-content:center}.image-actions label:only-child{grid-column:1/-1}.ingredients{margin-top:21px;padding-top:18px}.ingredients>p{margin-bottom:13px}.ingredient-list{gap:7px}.ingredient-list span,.ingredient-list button{min-height:40px;padding:8px 12px}.ingredient-list button b{display:none}
      .related{padding:22px 0 40px}.related-heading{margin-bottom:8px}.related-heading h2{font-size:19px}.related-heading>div{gap:9px}.empty{padding:45px 16px}.modal-mask{align-items:flex-end;padding:0}.modal{width:100%;max-height:92vh;padding:22px 16px 28px;border-radius:16px 16px 0 0}.add-form{grid-template-columns:1fr;gap:15px}.add-form .full,.form-actions{grid-column:1}.form-actions{display:grid;grid-template-columns:1fr 1fr}.form-actions button{min-height:43px}footer{margin:0 14px;padding:17px 0 24px;gap:12px;font-size:10px}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>

      {id:'mushroom-bamboo',name:'蘑菇炒春笋',category:'素菜',ingredients:['蘑菇','春笋'],shot:[7,391]}
    ];
    const CATEGORY_OPTIONS=[['海鲜','🦐'],['肉菜','🥩'],['素菜','🥦'],['主食','🍚'],['汤品','🥣'],['甜品','🍮'],['火锅','🍲'],['其他','🍽️']];
    const NON_LINKED=new Set(['蒜','葱','姜','黑胡椒','糖','醋','孜然','咖喱','可乐','茶叶','迷迭香']);
    const state={category:'全部',query:'',selected:null,related:null,custom:{},customDishes:[],dishEdits:{},notice:'',showAdd:false,editingId:null,formNotice:''};
    const app=document.getElementById('app');
    function allDishes(){return [...DISHES,...state.customDishes].map(d=>state.dishEdits[d.id]?{...d,...state.dishEdits[d.id]}:d)}
    function availableCategories(){const used=new Set(allDishes().map(d=>d.category));return [['全部','▦'],...CATEGORY_OPTIONS.filter(c=>used.has(c[0]))]}
    function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function icon(name){return name==='search'?'⌕':name==='back'?'←':name==='image'?'▧':name==='reset'?'↺':'×'}
    function header(){return '<header><button onclick="goHome()">開開厨房</button></header>'}
    function footer(){return '<footer><span>菜单来自上传截图</span><span>自定义图片保存在当前浏览器</span></footer>'}
    function dishImage(d){const custom=state.custom[d.id];if(custom||d.image)return '<div class="dish-image"><img src="'+esc(custom||d.image)+'" alt="'+esc(d.name)+'"></div>';if(!d.shot)return '<div class="dish-image image-placeholder"><span>暂无图片</span></div>';const p=(d.shot[1]/1172*100).toFixed(2);return '<div class="dish-image screenshot-image" aria-hidden="true" style="background-image:url(\'screens/menu-'+d.shot[0]+'.jpg\');background-position:33.3% '+p+'%"></div>'}
    function card(d){return '<article class="recipe"><button onclick="openDish(\''+d.id+'\')">'+dishImage(d)+'<div class="recipe-info"><div><h2>'+esc(d.name)+'</h2><span>'+esc(d.category)+'</span></div><p>'+d.ingredients.map(esc).join(' · ')+'</p></div></button></article>'}
    function addDishModal(){if(!state.showAdd)return '';const d=state.editingId?allDishes().find(x=>x.id===state.editingId):null,title=d?'修改菜品':'新增菜品',ingredients=d?d.ingredients.join('、'):'';return '<div class="modal-mask" onclick="if(event.target===this)closeAdd()"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle"><div class="modal-head"><h2 id="addTitle">'+title+'</h2><button onclick="closeAdd()" aria-label="关闭">×</button></div><form class="add-form" onsubmit="saveDish(event)"><label>菜名<input name="name" required maxlength="30" autocomplete="off" value="'+esc(d?.name||'')+'"></label><label>分类<select name="category">'+CATEGORY_OPTIONS.map(c=>'<option value="'+c[0]+'"'+(d?.category===c[0]?' selected':'')+'>'+c[0]+'</option>').join('')+'</select></label><label class="full">主要食材<textarea name="ingredients" required placeholder="可用空格、逗号或顿号分开">'+esc(ingredients)+'</textarea></label><label class="full">'+(d?'更换图片（可选）':'菜品图片（可选）')+'<input name="image" type="file" accept="image/*"></label><p class="full form-note">食材会按空格、逗号、顿号或换行自动拆分。</p>'+(state.formNotice?'<p class="form-note full">'+esc(state.formNotice)+'</p>':'')+'<div class="form-actions"><button type="button" onclick="closeAdd()">取消</button><button class="primary" type="submit">保存</button></div></form></section></div>'}
    function renderList(){const ALL=allDishes(),q=state.query.trim();const shown=ALL.filter(d=>(state.category==='全部'||d.category===state.category)&&(!q||d.name.includes(q)||d.ingredients.some(i=>i.includes(q))));app.innerHTML=header()+'<main class="workspace"><aside><nav aria-label="菜品分类">'+availableCategories().map(c=>{const n=c[0]==='全部'?ALL.length:ALL.filter(d=>d.category===c[0]).length;return '<button class="'+(state.category===c[0]?'active':'')+'" onclick="setCategory(\''+c[0]+'\')"><span class="nav-icon">'+c[1]+'</span><span>'+c[0]+'</span><small>'+n+'</small></button>'}).join('')+'</nav><p>当前共 '+ALL.length+' 道菜</p></aside><section><div class="toolbar"><div class="toolbar-title"><h1>'+(state.category==='全部'?'菜单':state.category)+'</h1><p>'+shown.length+' 道菜</p></div><div class="toolbar-actions"><label class="search">'+icon('search')+'<input id="searchInput" value="" placeholder="搜索菜名或食材" aria-label="搜索菜名或食材">'+(q?'<button onclick="clearSearch()" aria-label="清空搜索">'+icon('close')+'</button>':'')+'</label><button class="add-dish" onclick="openAdd()">＋ 新增菜品</button></div></div><div class="recipe-grid">'+shown.map(card).join('')+'</div>'+(!shown.length?'<div class="empty">没有找到相关菜品<button onclick="clearSearch()">查看全部</button></div>':'')+'</section></main>'+footer()+addDishModal();const input=document.getElementById('searchInput');input.value=state.query;input.addEventListener('input',e=>{state.query=e.target.value;renderList();requestAnimationFrame(()=>{const next=document.getElementById('searchInput');next.focus();next.setSelectionRange(next.value.length,next.value.length)})})}
    function renderDetail(){const ALL=allDishes(),d=ALL.find(x=>x.id===state.selected),related=state.related?ALL.filter(x=>x.ingredients.includes(state.related)):[];app.innerHTML=header()+'<main class="detail-main"><button class="back" onclick="goHome()">'+icon('back')+' 返回菜单</button><section class="detail"><div class="detail-visual">'+dishImage(d)+'<div class="image-actions"><label>'+icon('image')+' 更换图片<input type="file" accept="image/*" onchange="changeImage(event)"></label>'+(state.custom[d.id]?'<button onclick="restoreImage()">'+icon('reset')+' 恢复原图</button>':'')+'</div>'+(state.notice?'<output class="image-notice">'+state.notice+'</output>':'')+'</div><div class="detail-copy"><span class="category-label">'+esc(d.category)+'</span><h1>'+esc(d.name)+'</h1><div class="ingredients"><h2>主要食材</h2><p>点击主要食材查看相关菜品</p><div class="ingredient-list">'+d.ingredients.map(i=>NON_LINKED.has(i)?'<span class="plain">'+esc(i)+'</span>':'<button class="'+(state.related===i?'active':'')+'" data-ingredient="'+esc(i)+'" onclick="setRelated(this.dataset.ingredient)">'+esc(i)+'<b>↗</b></button>').join('')+'</div></div><div class="detail-controls"><button class="edit-dish" onclick="openEdit()">修改菜品</button>'+(d.custom?'<button class="delete-dish" onclick="deleteCustomDish()">删除此菜品</button>':'')+'</div></div></section>'+(state.related?'<section class="related"><div class="related-heading"><div><h2>含「'+esc(state.related)+'」的菜</h2><span>'+related.length+' 道</span></div><button onclick="setRelated(null)">收起</button></div><div class="recipe-grid">'+related.map(card).join('')+'</div></section>':'')+'</main>'+footer()+addDishModal()}
    function render(){state.selected?renderDetail():renderList()}
    function goHome(){state.selected=null;state.related=null;state.notice='';render();scrollTo(0,0)}
    function openDish(id){state.selected=id;state.related=null;state.notice='';render();scrollTo({top:0,behavior:'smooth'})}
    function setCategory(c){state.category=c;render()}
    function clearSearch(){state.query='';state.category='全部';render()}
    function setRelated(i){state.related=state.related===i?null:i;render();if(state.related)setTimeout(()=>document.querySelector('.related')?.scrollIntoView({behavior:'smooth'}),0)}
    function openAdd(){state.showAdd=true;state.editingId=null;state.formNotice='';render()}
    function openEdit(){state.showAdd=true;state.editingId=state.selected;state.formNotice='';render()}
    function closeAdd(){state.showAdd=false;state.editingId=null;state.formNotice='';render()}
    function persistCustomDishes(){localStorage.setItem('kaikai-custom-dishes',JSON.stringify(state.customDishes))}
    function persistDishEdits(){localStorage.setItem('kaikai-dish-edits',JSON.stringify(state.dishEdits))}
    function splitIngredients(value){return [...new Set(String(value||'').split(/[\s，,、；;]+/).map(i=>i.trim()).filter(Boolean))]}
    async function saveDish(event){event.preventDefault();const form=event.currentTarget,data=new FormData(form),name=String(data.get('name')||'').trim(),category=String(data.get('category')||'其他'),ingredients=splitIngredients(data.get('ingredients')),file=form.elements.image.files?.[0];if(!name||!ingredients.length){state.formNotice='请填写菜名和主要食材';return render()}if(file&&file.size>20*1024*1024){state.formNotice='图片请控制在 20 MB 以内';return render()}let id=state.editingId;if(id){state.dishEdits[id]={name,category,ingredients};persistDishEdits()}else{const dish={id:'custom-'+Date.now().toString(36),name,category,ingredients,custom:true};state.customDishes.push(dish);persistCustomDishes();id=dish.id}if(file){try{await putImage(id,file);state.custom[id]=URL.createObjectURL(file)}catch(error){state.notice='菜品已保存，但图片保存失败'}}state.showAdd=false;state.editingId=null;state.selected=id;state.related=null;render();scrollTo(0,0)}
    async function deleteCustomDish(){const d=allDishes().find(x=>x.id===state.selected);if(!d?.custom||!confirm('删除「'+d.name+'」？'))return;state.customDishes=state.customDishes.filter(x=>x.id!==d.id);delete state.dishEdits[d.id];persistCustomDishes();persistDishEdits();try{await removeImage(d.id)}catch(error){}delete state.custom[d.id];state.category='全部';goHome()}
    const DB='kaikai-kitchen-github',STORE='dish-images';
    function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
    async function loadImages(){try{const db=await openDb(),s=db.transaction(STORE,'readonly').objectStore(STORE);const keys=await new Promise((res,rej)=>{const r=s.getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),vals=await new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});keys.forEach((k,i)=>state.custom[k]=URL.createObjectURL(vals[i]));db.close();render()}catch(e){}}
    async function putImage(id,file){const db=await openDb(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(file,id);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
    async function removeImage(id){const db=await openDb(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
    async function changeImage(e){const d=allDishes().find(x=>x.id===state.selected),file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){state.notice='请选择图片文件';return render()}if(file.size>20*1024*1024){state.notice='图片请控制在 20 MB 以内';return render()}try{await putImage(d.id,file);state.custom[d.id]=URL.createObjectURL(file);state.notice='图片已保存到当前浏览器'}catch(err){state.notice='图片保存失败，请换一张重试'}render()}
    async function restoreImage(){const d=allDishes().find(x=>x.id===state.selected);await removeImage(d.id);delete state.custom[d.id];state.notice='已恢复原图';render()}
    try{const saved=JSON.parse(localStorage.getItem('kaikai-custom-dishes')||'[]');if(Array.isArray(saved))state.customDishes=saved.filter(d=>d&&d.custom&&/^custom-[a-z0-9]+$/.test(d.id)&&typeof d.name==='string'&&typeof d.category==='string'&&Array.isArray(d.ingredients)&&d.ingredients.every(i=>typeof i==='string'))}catch(error){}
    try{const saved=JSON.parse(localStorage.getItem('kaikai-dish-edits')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))state.dishEdits=Object.fromEntries(Object.entries(saved).filter(([id,d])=>/^[a-z0-9-]+$/.test(id)&&d&&typeof d.name==='string'&&typeof d.category==='string'&&Array.isArray(d.ingredients)&&d.ingredients.every(i=>typeof i==='string')))}catch(error){}
    render();loadImages();
  </script>
</body>
</html>
