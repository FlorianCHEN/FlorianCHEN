<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>个人厨房工作台</title>
<style>:root {
  --bg: #f6f7f4;
  --card: #ffffff;
  --text: #1c231f;
  --muted: #7a837d;
  --line: #e6e9e4;
  --accent: #2f6f4e;
  --accent-soft: #eaf3ed;
  --shadow: 0 10px 30px rgba(28,35,31,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column;gap:24px}
.brand{font-size:24px;font-weight:800}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:8px}.nav-btn{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:12px}.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.main{padding:28px 34px;max-width:1400px;width:100%;margin:0 auto}
.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.search{flex:1;max-width:520px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 16px;outline:none}
.hero{background:linear-gradient(135deg,#f2efe7,#e9f3eb);border-radius:24px;padding:28px;margin-bottom:28px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 8px;font-size:34px}.hero p{margin:0;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.section-head h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:.2s transform,.2s box-shadow}.card:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(28,35,31,.09)}
.card button{all:unset;display:block;width:100%;cursor:pointer}.food-img{aspect-ratio:16/10;background:linear-gradient(135deg,#ddd7ca,#c9d8cb);display:flex;align-items:center;justify-content:center;font-size:46px}
.card-body{padding:16px}.card-title{font-weight:800;font-size:18px;margin-bottom:10px}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{background:#f3f5f2;border:1px solid var(--line);padding:5px 8px;border-radius:999px;font-size:12px;color:#4d5650}.meta{margin-top:12px;color:var(--muted);font-size:13px}
.mobile-cats{display:none}
.detail{max-width:980px;margin:0 auto}.back{border:0;background:transparent;padding:0 0 16px;color:var(--accent);font-weight:700}
.detail-hero{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.detail-cover{aspect-ratio:16/7;background:linear-gradient(135deg,#d7c8b7,#a8c2aa);display:flex;align-items:center;justify-content:center;font-size:90px}
.detail-content{padding:26px}.detail-title{font-size:34px;margin:0 0 8px}.detail-desc{color:var(--muted);margin:0 0 18px}.detail-meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#f3f5f2;border-radius:999px;padding:8px 12px;font-size:13px}
.ingredients{margin-top:24px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.ingredients h3{margin-top:0}.ingredient-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.ingredient{border:1px solid var(--line);background:#fafbf9;border-radius:16px;padding:14px;text-align:center}.ingredient:hover,.ingredient.active{border-color:var(--accent);background:var(--accent-soft)}.ingredient-icon{font-size:30px;margin-bottom:8px}.ingredient-name{font-weight:700}
.related{margin-top:24px}.related h3{margin-bottom:6px}.related p{color:var(--muted);margin-top:0}
.empty{padding:40px;background:#fff;border-radius:18px;border:1px solid var(--line);color:var(--muted)}
@media (max-width: 1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ingredient-grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width: 760px){
  .app-shell{display:block}.sidebar{display:none}.main{padding:18px 14px}.topbar{display:block}.search{max-width:none;width:100%}.hero{padding:20px;margin-bottom:18px}.hero h1{font-size:28px}.mobile-cats{display:flex;gap:8px;overflow:auto;padding:2px 0 16px}.mobile-cat{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.mobile-cat.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:700}.grid{grid-template-columns:1fr}.detail-cover{aspect-ratio:4/3;font-size:70px}.detail-content{padding:18px}.detail-title{font-size:28px}.ingredient-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>const categories = ['全部','主食','海鲜','炒菜','汤类','凉菜','甜品','饮品'];
const recipes = [
  {id:1,name:'番茄炒蛋',cat:'炒菜',emoji:'🍅',time:'10分钟',difficulty:'简单',serves:'2人',desc:'酸甜开胃的家常菜。',ingredients:['番茄','鸡蛋','葱','盐']},
  {id:2,name:'青椒炒蛋',cat:'炒菜',emoji:'🫑',time:'15分钟',difficulty:'简单',serves:'2-3人',desc:'青椒清香配上嫩滑鸡蛋。',ingredients:['青椒','鸡蛋','蒜','盐','食用油']},
  {id:3,name:'宫保鸡丁',cat:'炒菜',emoji:'🍗',time:'20分钟',difficulty:'中等',serves:'2-3人',desc:'咸鲜微辣，经典下饭菜。',ingredients:['鸡胸肉','花生','干辣椒','葱']},
  {id:4,name:'清蒸鲈鱼',cat:'海鲜',emoji:'🐟',time:'15分钟',difficulty:'简单',serves:'2人',desc:'鲜嫩清爽，突出鱼本味。',ingredients:['鲈鱼','姜','葱','生抽']},
  {id:5,name:'蒜蓉大虾',cat:'海鲜',emoji:'🦐',time:'20分钟',difficulty:'简单',serves:'2-3人',desc:'鲜香浓郁，做法简单。',ingredients:['大虾','大蒜','生抽','料酒','盐','黑胡椒','葱','食用油']},
  {id:6,name:'海鲜炒饭',cat:'主食',emoji:'🍚',time:'15分钟',difficulty:'简单',serves:'2人',desc:'一锅完成的快手主食。',ingredients:['米饭','虾仁','鸡蛋','葱']},
  {id:7,name:'牛肉炒面',cat:'主食',emoji:'🍜',time:'20分钟',difficulty:'简单',serves:'2人',desc:'牛肉香嫩，面条入味。',ingredients:['牛肉','面条','洋葱','生抽']},
  {id:8,name:'冬瓜排骨汤',cat:'汤类',emoji:'🥣',time:'40分钟',difficulty:'简单',serves:'3人',desc:'清淡鲜甜，适合日常。',ingredients:['冬瓜','排骨','姜','盐']},
  {id:9,name:'凉拌黄瓜',cat:'凉菜',emoji:'🥒',time:'10分钟',difficulty:'简单',serves:'2人',desc:'爽脆开胃。',ingredients:['黄瓜','大蒜','香醋','盐']},
  {id:10,name:'青椒炒牛肉',cat:'炒菜',emoji:'🥩',time:'20分钟',difficulty:'中等',serves:'2人',desc:'青椒脆嫩，牛肉滑香。',ingredients:['青椒','牛肉','姜','生抽']},
  {id:11,name:'虎皮青椒',cat:'炒菜',emoji:'🌶️',time:'15分钟',difficulty:'简单',serves:'2人',desc:'香辣过瘾。',ingredients:['青椒','大蒜','生抽','醋']},
  {id:12,name:'青椒肉丝',cat:'炒菜',emoji:'🥢',time:'15分钟',difficulty:'简单',serves:'2人',desc:'家常快手，百吃不腻。',ingredients:['青椒','猪肉','葱','生抽']},
  {id:13,name:'青椒土豆丝',cat:'炒菜',emoji:'🥔',time:'15分钟',difficulty:'简单',serves:'2人',desc:'清爽脆嫩。',ingredients:['青椒','土豆','醋','盐']},
];

let state = { category:'全部', query:'', page:'list', recipe:null, ingredient:null };

function filteredRecipes(){
  return recipes.filter(r => (state.category==='全部'||r.cat===state.category) && (r.name.includes(state.query)||r.ingredients.some(i=>i.includes(state.query))));
}
function recipeCard(r){
  return `<article class="card"><button onclick="openRecipe(${r.id})"><div class="food-img">${r.emoji}</div><div class="card-body"><div class="card-title">${r.name}</div><div class="tags">${r.ingredients.slice(0,4).map(i=>`<span class="tag">${i}</span>`).join('')}</div><div class="meta">⏱ ${r.time} · ${r.difficulty}</div></div></button></article>`;
}
function shell(content){
  return `<div class="app-shell"><aside class="sidebar"><div class="brand">个人厨房工作台<small>记录美味，享受生活</small></div><nav class="nav">${categories.map(c=>`<button class="nav-btn ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</nav></aside><main class="main"><div class="topbar"><input class="search" placeholder="搜索菜谱、食材…" value="${state.query}" oninput="searchRecipe(this.value)"></div><div class="mobile-cats">${categories.map(c=>`<button class="mobile-cat ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div>${content}</main></div>`;
}
function renderList(){
  const list = filteredRecipes();
  const content = `<section class="hero"><h1>我的厨房</h1><p>按分类浏览，或从一个食材出发发现更多菜谱。</p></section><div class="section-head"><h2>菜品列表</h2><span>${list.length} 道</span></div>${list.length?`<section class="grid">${list.map(recipeCard).join('')}</section>`:`<div class="empty">没有找到相关菜谱。</div>`}`;
  document.querySelector('#app').innerHTML = shell(content);
}
function renderDetail(){
  const r = state.recipe; const ing = state.ingredient;
  let related = [];
  if(ing) related = recipes.filter(x=>x.id!==r.id && x.ingredients.includes(ing));
  const content = `<section class="detail"><button class="back" onclick="goBack()">← 返回菜谱列表</button><div class="detail-hero"><div class="detail-cover">${r.emoji}</div><div class="detail-content"><h1 class="detail-title">${r.name}</h1><p class="detail-desc">${r.desc}</p><div class="detail-meta"><span class="pill">⏱ ${r.time}</span><span class="pill">${r.difficulty}</span><span class="pill">👥 ${r.serves}</span></div></div></div><section class="ingredients"><h3>用料</h3><div class="ingredient-grid">${r.ingredients.map(i=>`<button class="ingredient ${ing===i?'active':''}" onclick="selectIngredient('${i}')"><div class="ingredient-icon">${ingredientIcon(i)}</div><div class="ingredient-name">${i}</div></button>`).join('')}</div></section>${ing?`<section class="related"><h3>相关菜谱 · ${ing}</h3><p>包含「${ing}」的其他菜谱</p>${related.length?`<div class="grid">${related.map(recipeCard).join('')}</div>`:`<div class="empty">暂时没有更多包含「${ing}」的菜谱。</div>`}</section>`:''}</section>`;
  document.querySelector('#app').innerHTML = shell(content);
}
function ingredientIcon(i){
  const m={青椒:'🫑',鸡蛋:'🥚',蒜:'🧄',大蒜:'🧄',盐:'🧂',食用油:'🫗',番茄:'🍅',牛肉:'🥩',猪肉:'🥩',葱:'🌿',姜:'🫚',土豆:'🥔',大虾:'🦐',鲈鱼:'🐟',米饭:'🍚',面条:'🍜',冬瓜:'🍈',黄瓜:'🥒'}; return m[i]||'🥣';
}
window.setCategory = c => { state.category=c; state.page='list'; state.recipe=null; state.ingredient=null; renderList(); };
window.searchRecipe = q => { state.query=q; if(state.page==='list') renderList(); else renderDetail(); };
window.openRecipe = id => { state.recipe=recipes.find(r=>r.id===id); state.page='detail'; state.ingredient=null; renderDetail(); window.scrollTo({top:0,behavior:'smooth'}); };
window.selectIngredient = i => { state.ingredient=i; renderDetail(); setTimeout(()=>document.querySelector('.related')?.scrollIntoView({behavior:'smooth',block:'start'}),0); };
window.goBack = () => { state.page='list'; state.recipe=null; state.ingredient=null; renderList(); };
renderList();
</script>
</body>
</html>
