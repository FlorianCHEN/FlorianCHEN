    function renderList(){const ALL=allDishes(),q=state.query.trim();const shown=ALL.filter(d=>(state.category==='全部'||d.category===state.category)&&(!q||d.name.includes(q)||d.ingredients.some(i=>i.includes(q))));app.innerHTML=header('list')+'<main class="workspace"><aside><nav aria-label="菜品分类">'+availableCategories().map(c=>{const n=c[0]==='全部'?ALL.length:ALL.filter(d=>d.category===c[0]).length;return '<button class="'+(state.category===c[0]?'active':'')+'" onclick="setCategory(\''+c[0]+'\')"><span class="nav-icon">'+c[1]+'</span><span>'+c[0]+'</span><small>'+n+'</small></button>'}).join('')+'</nav><p>当前共 '+ALL.length+' 道菜</p></aside><section><div class="toolbar"><div class="toolbar-title"><h1>'+(state.category==='全部'?'菜单':state.category)+'</h1><p>'+shown.length+' 道菜</p></div><div class="toolbar-actions"><label class="search">'+icon('search')+'<input id="searchInput" value="" placeholder="搜索菜名或食材" aria-label="搜索菜名或食材">'+(q?'<button onclick="clearSearch()" aria-label="清空搜索">'+icon('close')+'</button>':'')+'</label>'+(state.isAdmin?'<button class="add-dish" onclick="openAdd()">＋ 新增菜品</button>':'')+'</div></div><div class="mobile-filters">'+availableCategories().map(c=>'<button class="'+(state.category===c[0]?'active':'')+'" onclick="setCategory(\''+c[0]+'\')">'+esc(c[0])+'</button>').join('')+'</div><div class="recipe-grid">'+shown.map(card).join('')+'</div>'+(!shown.length?'<div class="empty">没有找到相关菜品<button onclick="clearSearch()">查看全部</button></div>':'')+'</section></main>'+footer()+mobileDrawer()+addDishModal()+authModal();const input=document.getElementById('searchInput');input.value=state.query;input.addEventListener('input',e=>{state.query=e.target.value;renderList();requestAnimationFrame(()=>{const next=document.getElementById('searchInput');next.focus();next.setSelectionRange(next.value.length,next.value.length)})})}
    function renderDetail(){const ALL=allDishes(),d=ALL.find(x=>x.id===state.selected),related=state.related?ALL.filter(x=>x.ingredients.includes(state.related)):[];if(!d)return goHome();app.innerHTML=header('detail')+'<main class="detail-main'+(state.related?' related-open':'')+'"><div class="mobile-page-head detail-page-head"><button onclick="goHome()" aria-label="返回">‹</button><h2>菜谱详情</h2><button onclick="openEdit()" aria-label="修改菜谱">···</button></div><button class="back" onclick="goHome()">'+icon('back')+' 返回菜单</button><section class="detail"><div class="detail-visual">'+dishImage(d)+(state.isAdmin?'<div class="image-actions"><label>'+icon('image')+' 更换图片<input type="file" accept="image/*" onchange="changeImage(event)"></label>'+(state.custom[d.id]?'<button onclick="restoreImage()">'+icon('reset')+' 恢复原图</button>':'')+'</div>':'')+(state.notice?'<output class="image-notice">'+state.notice+'</output>':'')+'</div><div class="detail-copy"><span class="category-label">'+esc(d.category)+'</span><h1>'+esc(d.name)+'</h1><div class="detail-tags">'+d.ingredients.slice(0,3).map(i=>'<span>'+esc(i)+'</span>').join('')+'</div>'+(d.description?'<p class="dish-description">'+esc(d.description)+'</p>':'')+'<div class="ingredients"><h2>食材</h2><p>点击主要食材查看相关菜品</p><div class="ingredient-list">'+d.ingredients.map(i=>NON_LINKED.has(i)?'<span class="plain">'+esc(i)+'</span>':'<button class="'+(state.related===i?'active':'')+'" data-ingredient="'+esc(i)+'" onclick="setRelated(this.dataset.ingredient)">'+esc(i)+'<b>›</b></button>').join('')+'</div></div>'+(state.isAdmin?'<div class="detail-controls"><button class="edit-dish" onclick="openEdit()">修改菜品</button><button class="delete-dish" onclick="deleteDish()">删除菜品</button></div>':'')+'</div></section>'+(state.related?'<section class="related"><div class="mobile-page-head related-page-head"><button onclick="setRelated(null)" aria-label="返回">‹</button><h2>相关菜谱</h2><span></span></div><div class="related-intro"><h1>'+esc(state.related)+'</     async function hashPassword(value){const buffer=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));return [...new Uint8Array(buffer)].map(b=>b.toString(16).padStart(2,'0')).join('')}

    async function saveDish(event){event.preventDefault();if(!state.isAdmin)return openLogin();const form=event.currentTarget,data=new FormData(form),name=String(data.get('name')||'').trim(),category=String(data.get('category')||'其他'),ingredients=splitIngredients(data.get('ingredients')),description=String(data.get('description')||'').trim(),file=form.elements.image.files?.[0];if(!name||!ingredients.length){state.formNotice='请填写菜名和主要食材';return render()}if(file&&file.size>20*1024*1024){state.formNotice='图片请控制在 20 MB 以内';return render()}let id=state.editingId;if(id){state.dishEdits[id]={name,category,ingredients,description};persistDishEdits()}else{const dish={id:'custom-'+Date.now().toString(36),name,category,ingredients,description,custom:true};state.customDishes.push(dish);persistCustomDishes();id=dish.id}if(file){try{await putImage(id,file);state.custom[id]=URL.createObjectURL(file)}catch(error){state.notice='菜品已保存，但图片保存失败'}}state.showAdd=false;state.editingId=null;state.selected=id;state.related=null;render();scrollTo(0,0)}

    const DB='kaikai-kitchen-github',STORE='dish-images';
    function openDb(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
    async function loadImages(){try{const db=await openDb(),s=db.transaction(STORE,'readonly').objectStore(STORE);const keys=await new Promise((res,rej)=>{const r=s.getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),vals=await new Promise((res,rej)=>{const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});keys.forEach((k,i)=>state.custom[k]=URL.createObjectURL(vals[i]));db.close();render()}catch(e){}}
    async function putImage(id,file){const db=await openDb(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(file,id);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
    async function removeImage(id){const db=await openDb(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});db.close()}
    async function changeImage(e){if(!state.isAdmin)return openLogin();const d=allDishes().find(x=>x.id===state.selected),file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){state.notice='请选择图片文件';return render()}if(file.size>20*1024*1024){state.notice='图片请控制在 20 MB 以内';return render()}try{await putImage(d.id,file);state.custom[d.id]=URL.createObjectURL(file);state.notice='图片已保存到当前浏览器'}catch(err){state.notice='图片保存失败，请换一张重试'}render()}
    async function restoreImage(){if(!state.isAdmin)return openLogin();const d=allDishes().find(x=>x.id===state.selected);await removeImage(d.id);delete state.custom[d.id];state.notice='已恢复原图';render()}
    try{const saved=JSON.parse(localStorage.getItem('kaikai-custom-dishes')||'[]');if(Array.isArray(saved))state.customDishes=saved.filter(d=>d&&d.custom&&/^custom-[a-z0-9]+$/.test(d.id)&&typeof d.name==='string'&&typeof d.category==='string'&&Array.isArray(d.ingredients)&&d.ingredients.every(i=>typeof i==='string'))}catch(error){}
    try{const saved=JSON.parse(localStorage.getItem('kaikai-dish-edits')||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved))state.dishEdits=Object.fromEntries(Object.entries(saved).filter(([id,d])=>/^[a-z0-9-]+$/.test(id)&&d&&typeof d.name==='string'&&typeof d.category==='string'&&Array.isArray(d.ingredients)&&d.ingredients.every(i=>typeof i==='string')))}catch(error){}
    try{const saved=JSON.parse(localStorage.getItem('kaikai-deleted-dishes')||'[]');if(Array.isArray(saved))state.deletedDishes=new Set(saved.filter(id=>typeof id==='string'&&/^[a-z0-9-]+$/.test(id)))}catch(error){}
    render();loadImages();
  </script>
</body>
</html>
